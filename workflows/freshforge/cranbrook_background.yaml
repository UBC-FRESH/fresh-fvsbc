workflow:
  id: cranbrook_background_calibration
  name: Cranbrook background candidate
  description: >
    Fit the target-excluded growth-free candidate for Cranbrook and freeze
    aggregate metrics and coefficients. The workflow writes no site-level rows.

nodes:
  - id: fit_and_freeze_cranbrook
    provider: fresh_fvsbc.freshforge.native_script
    parameters:
      script: notes/reference/calibration/fit_candidate.py
      args:
        - --target-tsa
        - Cranbrook TSA
        - --model-id
        - cranbrook-background-v0
        - --calibration
        - none
        - --min-target-trees
        - "500"
        - --metrics
        - notes/reference/calibration/cranbrook-candidate/metrics.csv
        - --model-card
        - notes/reference/calibration/cranbrook-candidate/model-card.json
    artifacts:
      metrics: notes/reference/calibration/cranbrook-candidate/metrics.csv
      model_card: notes/reference/calibration/cranbrook-candidate/model-card.json
