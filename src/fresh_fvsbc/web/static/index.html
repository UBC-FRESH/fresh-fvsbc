<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fresh-fvsbc</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#panel-body">Skip to content</a>

    <header class="topbar">
      <div class="brand">
        <strong>fresh-fvsbc</strong>
        <span class="muted" id="oracle-badge"></span>
      </div>
      <div class="controls">
        <button id="new-run-button" class="primary" type="button">New run</button>
        <button id="details-button" class="ghost" type="button" aria-label="Open run evidence details" aria-expanded="false" disabled>Details</button>
        <label>Skin <select id="skin-select"></select></label>
        <label>Run <select id="run-select"></select></label>
        <span class="badge" id="run-state"></span>
      </div>
    </header>

    <nav id="workspace-nav" class="workspace-nav" role="tablist" aria-label="Workspaces"></nav>

    <div class="shell">
      <nav class="panels" id="panel-nav" role="tablist" aria-label="Panels"></nav>
      <main id="panel-body" class="panel-body" role="tabpanel" tabindex="-1">
        <p class="muted">Choose a run, or start a new one.</p>
      </main>
    </div>

    <footer class="footer">
      <span class="muted" id="footer-note"></span>
    </footer>

    <dialog id="new-run-dialog" class="dialog">
      <form id="new-run-form" method="dialog" class="dialog-card">
        <div class="dialog-head">
          <div>
            <h2>New FVS run</h2>
            <p class="muted">The service writes the run under its configured runs root.</p>
          </div>
          <button id="close-new-run" class="ghost" type="button" aria-label="Close">×</button>
        </div>

        <div class="form-grid">
          <label class="field field-wide">
            <span>Population / tree list path</span>
            <input id="new-population" type="text" required placeholder="/path/to/treelist.csv" />
            <small>Server-side path to a tree list the CLI can read.</small>
          </label>
          <label class="field">
            <span>Species</span>
            <input id="new-species" type="text" required value="FD" />
          </label>
          <label class="field">
            <span>Tree age</span>
            <input id="new-tree-age" type="number" min="1" step="1" value="60" required />
          </label>
          <label class="field field-wide">
            <span>Run id <em>optional</em></span>
            <input id="new-run-id" type="text" placeholder="leave blank for a timestamp" />
          </label>
          <label class="field field-wide">
            <span>Calibration bundle <em>optional</em></span>
            <select id="new-bundle"><option value="">No calibration</option></select>
            <small id="new-bundle-note">A bundle renders its parameters and ingrowth block into the run.</small>
          </label>
          <label class="field">
            <span>Minimum DBH <em>cm, optional</em></span>
            <input id="new-min-dbh" type="number" min="0" step="0.1" placeholder="0" />
          </label>
          <label class="field">
            <span>TSA <em>optional</em></span>
            <input id="new-tsa" type="text" placeholder="Quesnel TSA" />
          </label>
          <label class="field field-wide">
            <span>Keyword lines <em>optional</em></span>
            <textarea id="new-keywords" rows="5" placeholder="MANAGED=0,1&#10;DATABASE|DSNOut|FVSOut.db|Summary|END"></textarea>
            <small>One keyword or block per line. A line containing <code>|</code> becomes a block.</small>
          </label>
        </div>

        <p id="new-run-error" class="form-error" hidden></p>

        <div class="dialog-actions">
          <button id="cancel-new-run" class="ghost" type="button">Cancel</button>
          <button class="primary" type="submit">Start run</button>
        </div>
      </form>
    </dialog>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="details-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="details-title" hidden>
      <div class="drawer-head">
        <div>
          <span class="eyebrow">Run evidence</span>
          <h2 id="details-title">Details</h2>
        </div>
        <button id="close-details" class="ghost" type="button" aria-label="Close details">×</button>
      </div>
      <div id="details-body" class="drawer-body">
        <p class="muted">Open a run to see its provenance, calibration state, and warnings.</p>
      </div>
    </aside>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
