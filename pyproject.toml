# Tool configuration for fresh-fvsbc. Each gate configured here is also a check in the
# green dashboard (scripts/dashboard.py).

[project]
name = "fresh-fvsbc"
version = "0.19.0"
description = "A Python wrapper for the BC variant of the Forest Vegetation Simulator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "UBC FRESH Lab" }]
keywords = ["forest-modelling", "fvs", "british-columbia", "growth-and-yield"]
dependencies = ["pandas>=2.0"]

[project.scripts]
fresh-fvsbc = "fresh_fvsbc.cli:main"

[project.optional-dependencies]
# The browser surface. The core install stays pandas-only; `fresh-fvsbc web` needs this extra.
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Repository = "https://github.com/UBC-FRESH/fresh-fvsbc"
Documentation = "https://ubc-fresh.github.io/fresh-fvsbc/"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fresh_fvsbc.web" = ["skins/*.json", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "src", "tests"]
extend-exclude = ["tmp", "_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts,src"
files = ["scripts", "tests", "docs/conf.py", "src/fresh_fvsbc"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

# PyFVS is the built variant, and the build is not installed where types are checked. It is also
# untyped: it ships no stubs, so the override is the only option short of writing them here.
[[tool.mypy.overrides]]
module = ["pyfvs", "pyfvs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov=src/fresh_fvsbc --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts", "src/fresh_fvsbc"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
