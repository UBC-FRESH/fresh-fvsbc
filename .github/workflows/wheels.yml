name: wheels

# The BC variant is Fortran. Until this workflow existed, using this package meant owning a
# gfortran toolchain, meson, and two patch sets — which is the whole distance between "our lab
# uses it" and "another lab can". The wheel this builds is self-contained: auditwheel bundles
# libgfortran, so nothing has to be installed but the wheel.
#
# manylinux_2_28 is the floor: glibc 2.28, which covers RHEL 8+, Ubuntu 20.04+, Debian 10+ and
# every current cluster. If a target cluster is older than that, the image below is the one line
# to change, and the tag follows.
#
# x86_64 only. aarch64, macOS and Windows each need their own toolchain and have no user yet.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "notes/reference/pyfvs-patchset.diff.gz"
      - "notes/reference/fvsbc-patchset.diff.gz"
      - "notes/reference/calibration/w2-subzones.patch.gz"
      - "notes/reference/calibration/w3-habtyp-boundary.patch.gz"
      - "notes/reference/calibration/w2-five-zone.patch.gz"
      - "notes/reference/calibration/w4-sbps-small-tree.patch.gz"
      - "notes/reference/calibration/w5-bwbs-v3.patch.gz"
      - "notes/reference/calibration/w6-sbs-large-tree.patch.gz"
      - "notes/reference/calibration/w7-sbps-large-tree.patch.gz"
      - "notes/reference/calibration/w8-cwh-v3.patch.gz"
      - "notes/reference/calibration/w9-mh-cdf-v3.patch.gz"
      - "notes/reference/calibration/w10-mh-cdf-own-dg.patch.gz"
      - "notes/reference/calibration/w11-cwh-height.patch.gz"
      - "notes/reference/calibration/w12-sbs-bamax.patch.gz"
      - "notes/reference/calibration/w13-pp-bamax.patch.gz"
      - "notes/reference/calibration/w14-pp-site-series.patch.gz"
      - "notes/reference/calibration/w15-ms-v3.patch.gz"
      - "notes/reference/calibration/w16-essf-v3.patch.gz"
      - "notes/reference/calibration/w17-pp-v3.patch.gz"
      - "notes/reference/calibration/w18-sbs-bl-dg.patch.gz"
      - "notes/reference/calibration/w21-cwh-small-joint.patch.gz"
      - "notes/reference/calibration/w22-sbs-bl-density.patch.gz"
      - "notes/reference/calibration/w28-sbsmc2-stem-shape.patch.gz"
      - "notes/reference/calibration/w30-cdf-high-ba-mort.patch.gz"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built wheels to an index"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

jobs:
  build:
    name: Build the BC wheel (${{ matrix.python }})
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python: ["cp310", "cp311", "cp312", "cp313"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install the Fortran toolchain
        run: |
          dnf install -y gcc-gfortran patchelf which
          # The compiler version is provenance: a build that produces different numbers needs to be
          # told apart from one that does not.
          gfortran --version | head -1

      - name: Check out the pinned fork and its FVS source
        run: |
          git config --global --add safe.directory '*'
          git clone --filter=blob:none https://github.com/UBC-FRESH/PyFVS.git ${{ runner.temp }}/PyFVS
          git -C ${{ runner.temp }}/PyFVS checkout e95172b
          git -C ${{ runner.temp }}/PyFVS submodule update --init --recursive
          echo "FVS source at $(git -C ${{ runner.temp }}/PyFVS/fvs rev-parse --short HEAD)"

      - name: Apply the banked patch sets
        run: |
          gunzip -c notes/reference/pyfvs-patchset.diff.gz > ${{ runner.temp }}/pyfvs.patch
          gunzip -c notes/reference/fvsbc-patchset.diff.gz > ${{ runner.temp }}/fvsbc.patch
          gunzip -c notes/reference/calibration/w2-subzones.patch.gz > ${{ runner.temp }}/w2-subzones.patch
          gunzip -c notes/reference/calibration/w3-habtyp-boundary.patch.gz > ${{ runner.temp }}/w3-habtyp-boundary.patch
          gunzip -c notes/reference/calibration/w2-five-zone.patch.gz > ${{ runner.temp }}/w2-five-zone.patch
          gunzip -c notes/reference/calibration/w4-sbps-small-tree.patch.gz > ${{ runner.temp }}/w4-sbps-small-tree.patch
          gunzip -c notes/reference/calibration/w5-bwbs-v3.patch.gz > ${{ runner.temp }}/w5-bwbs-v3.patch
          gunzip -c notes/reference/calibration/w6-sbs-large-tree.patch.gz > ${{ runner.temp }}/w6-sbs-large-tree.patch
          gunzip -c notes/reference/calibration/w7-sbps-large-tree.patch.gz > ${{ runner.temp }}/w7-sbps-large-tree.patch
          gunzip -c notes/reference/calibration/w8-cwh-v3.patch.gz > ${{ runner.temp }}/w8-cwh-v3.patch
          gunzip -c notes/reference/calibration/w9-mh-cdf-v3.patch.gz > ${{ runner.temp }}/w9-mh-cdf-v3.patch
          gunzip -c notes/reference/calibration/w10-mh-cdf-own-dg.patch.gz > ${{ runner.temp }}/w10-mh-cdf-own-dg.patch
          gunzip -c notes/reference/calibration/w11-cwh-height.patch.gz > ${{ runner.temp }}/w11-cwh-height.patch
          gunzip -c notes/reference/calibration/w12-sbs-bamax.patch.gz > ${{ runner.temp }}/w12-sbs-bamax.patch
          gunzip -c notes/reference/calibration/w13-pp-bamax.patch.gz > ${{ runner.temp }}/w13-pp-bamax.patch
          gunzip -c notes/reference/calibration/w14-pp-site-series.patch.gz > ${{ runner.temp }}/w14-pp-site-series.patch
          gunzip -c notes/reference/calibration/w15-ms-v3.patch.gz > ${{ runner.temp }}/w15-ms-v3.patch
          gunzip -c notes/reference/calibration/w16-essf-v3.patch.gz > ${{ runner.temp }}/w16-essf-v3.patch
          gunzip -c notes/reference/calibration/w17-pp-v3.patch.gz > ${{ runner.temp }}/w17-pp-v3.patch
          gunzip -c notes/reference/calibration/w18-sbs-bl-dg.patch.gz > ${{ runner.temp }}/w18-sbs-bl-dg.patch
          gunzip -c notes/reference/calibration/w21-cwh-small-joint.patch.gz > ${{ runner.temp }}/w21-cwh-small-joint.patch
          gunzip -c notes/reference/calibration/w22-sbs-bl-density.patch.gz > ${{ runner.temp }}/w22-sbs-bl-density.patch
          gunzip -c notes/reference/calibration/w28-sbsmc2-stem-shape.patch.gz > ${{ runner.temp }}/w28-sbsmc2-stem-shape.patch
          gunzip -c notes/reference/calibration/w30-cdf-high-ba-mort.patch.gz > ${{ runner.temp }}/w30-cdf-high-ba-mort.patch
          gunzip -c notes/reference/calibration/d9-mpb-bc.patch.gz > ${{ runner.temp }}/d9-mpb-bc.patch
          git -C ${{ runner.temp }}/PyFVS apply --check ${{ runner.temp }}/pyfvs.patch
          git -C ${{ runner.temp }}/PyFVS apply ${{ runner.temp }}/pyfvs.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/fvsbc.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/fvsbc.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w2-subzones.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w2-subzones.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w3-habtyp-boundary.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w3-habtyp-boundary.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w2-five-zone.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w2-five-zone.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w4-sbps-small-tree.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w4-sbps-small-tree.patch
          # W5 gives BWBS the V3 growth and mortality tables. It must follow w2-five-zone,
          # which is what makes the BWBS labels resolve in the first place.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w5-bwbs-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w5-bwbs-v3.patch
          # W6 gives SBS the site-series row its large-tree diameter growth needs. SBPS is excluded:
          # a zero intercept overflows its zone coefficients.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w6-sbs-large-tree.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w6-sbs-large-tree.patch
          # W7 replaces the unfinished SBPS large-tree coefficients and adds the site-series row.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w7-sbps-large-tree.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w7-sbps-large-tree.patch
          # W8 puts CWH on the V3 path with fitted large-tree DG and donor small-tree/height/mortality.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w8-cwh-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w8-cwh-v3.patch
          # W9 puts MH and CDF on V3 with the coastal donor rows.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w9-mh-cdf-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w9-mh-cdf-v3.patch
          # W10 replaces the MH and CDF coastal donor rows for HW/BG and FD/AT with zone fits.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w10-mh-cdf-own-dg.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w10-mh-cdf-own-dg.patch
          # W11 fits CWH large-tree height growth for six species and keeps the CW donor.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w11-cwh-height.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w11-cwh-height.patch
          # W12 gives SBS a per-subzone maximum basal area instead of a flat 55.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w12-sbs-bamax.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w12-sbs-bamax.patch
          # W13/W14 make PP resolve as PP: its missing site series and its measured caps.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w13-pp-bamax.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w13-pp-bamax.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w14-pp-site-series.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w14-pp-site-series.patch
          # W15 puts MS on the V3 path with fitted large-tree DG and height rows.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w15-ms-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w15-ms-v3.patch
          # W16 puts ESSF on the V3 path with fitted large-tree DG and height rows.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w16-essf-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w16-essf-v3.patch
          # W17 puts PP on the V3 path with fitted FD and PY rows.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w17-pp-v3.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w17-pp-v3.patch
          # W18 refits the SBS BL large-tree growth row from SBS pairs, weighted to 10-20 cm.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w18-sbs-bl-dg.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w18-sbs-bl-dg.patch
          # W21 gives CWH small trees a stand-density response in diameter and mortality.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w21-cwh-small-joint.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w21-cwh-small-joint.patch
          # W22 gives the SBS BL row a stand-density term for the dense SBSmc2 cell.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w22-sbs-bl-density.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w22-sbs-bl-density.patch
          # W28 saves small SBSmc2 stems and thins large ones.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w28-sbsmc2-stem-shape.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w28-sbsmc2-stem-shape.patch
          # W30 reduces CDF mortality above BA 90 m2/ha (dense-site check).
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/w30-cdf-high-ba-mort.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/w30-cdf-high-ba-mort.patch
          # D9.71 links the real LPMPB extension for the BC variant instead of the stub.
          git -C ${{ runner.temp }}/PyFVS/fvs apply --check ${{ runner.temp }}/d9-mpb-bc.patch
          git -C ${{ runner.temp }}/PyFVS/fvs apply ${{ runner.temp }}/d9-mpb-bc.patch

      - name: Build the wheel and repair it to manylinux
        run: |
          PY=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin
          # meson-python finds meson on PATH, and this step invokes the interpreter by absolute path,
          # so its bin directory has to be added explicitly.
          export PATH="$PY:$PATH"
          $PY/pip install -q --upgrade pip
          # meson itself, not only the backend: --no-build-isolation means pip installs no build
          # requirements, so the executable has to be here.
          $PY/pip install -q meson meson-python ninja numpy setuptools_scm auditwheel
          SETUPTOOLS_SCM_PRETEND_VERSION=0.4.15 $PY/pip wheel \
            --no-build-isolation --no-deps ${{ runner.temp }}/PyFVS \
            --config-settings=setup-args="-Dfvsvariants=bc" -w dist
          # Without this the wheel only runs where gfortran is installed, which is the problem it
          # exists to remove. The bundled copy is what the extension loads, via its patched RPATH.
          $PY/auditwheel repair dist/*.whl -w wheelhouse
          ls -l wheelhouse

      - name: Prove the wheel is self-contained
        run: |
          PY=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin
          export PATH="$PY:$PATH"
          # With its dependencies: `import pyfvs` needs them, and skipping them tests the wheel
          # against an environment nobody has.
          $PY/pip install -q wheelhouse/*.whl
          $PY/python -c "import pyfvs; print(pyfvs.list_variants())"
          $PY/python - <<'PY'
          import subprocess, sys
          import pyfvs.fvsbc as module
          linked = subprocess.run(["ldd", module.__file__], capture_output=True, text=True).stdout
          assert "fresh_fvsbc_pyfvs.libs" in linked, linked
          assert "not found" not in linked, linked
          print("  libgfortran resolves inside the wheel")
          PY

      # The extension job in `ci.yml` builds the variant without the W-series zone patches, so a
      # CWH or PP code does not resolve there. This job builds the wheel the release ships, which
      # does carry them; the smoke runs against that.
      - name: Smoke the built engine with the shipped bundles
        if: matrix.python == 'cp312'
        run: |
          PY=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin
          $PY/pip install -q pandas six
          PYTHONPATH=src $PY/python scripts/engine_smoke.py --directory "${{ runner.temp }}/smoke"

      - name: Keep the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Attach the wheels to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Collect the wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and attach them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # A tag push runs this before any release exists, so the release is created here rather
          # than by hand. `--repo` is explicit because this job needs no working directory for gh to
          # infer one from, and the notes come from the repository at the tag.
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "fresh-fvsbc ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.whl \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # `fresh-fvsbc-pyfvs` is published with trusted publishing, like the wrapper, but its version is
  # tied to the patch-set pin and does not move with every wrapper release. The two publish jobs are
  # manual, so a wrapper release cannot republish a binary by accident.
  #
  # The PyPI project must name this repository, this workflow, and the environment exactly:
  #   Repository: UBC-FRESH/fresh-fvsbc
  #   Workflow: wheels.yml
  #   Environment: testpypi  (TestPyPI) or pypi (PyPI)
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'testpypi'
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Collect the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'pypi'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Collect the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
