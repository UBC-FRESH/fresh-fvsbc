name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates, Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types (mypy --strict)
        run: python -m mypy

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate workflow surfaces
        run: python scripts/check_workflow.py

      - name: Mutation harness
        run: |
          python scripts/mutation_check.py --control
          python scripts/mutation_check.py

      - name: Build docs with warnings as errors
        run: sphinx-build -b html docs _build/html -W

  build-variant:
    name: Build the BC variant
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran meson ninja-build patchelf
          # The compiler version is provenance: a build that produces different numbers from the
          # oracle needs to be told apart from one that does not, and until now nothing recorded it.
          gfortran --version | head -1
          nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Install the build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python ninja numpy setuptools_scm

      - name: Check out the pinned fork and its FVS source
        run: |
          git clone --filter=blob:none https://github.com/UBC-FRESH/PyFVS.git "$RUNNER_TEMP/PyFVS"
          git -C "$RUNNER_TEMP/PyFVS" checkout e95172b
          git -C "$RUNNER_TEMP/PyFVS" submodule update --init --recursive
          echo "FVS source at $(git -C "$RUNNER_TEMP/PyFVS/fvs" rev-parse --short HEAD)"

      - name: Apply the banked patch sets
        run: |
          gunzip -c notes/reference/pyfvs-patchset.diff.gz > "$RUNNER_TEMP/pyfvs.patch"
          gunzip -c notes/reference/fvsbc-patchset.diff.gz > "$RUNNER_TEMP/fvsbc.patch"
          git -C "$RUNNER_TEMP/PyFVS" apply --check "$RUNNER_TEMP/pyfvs.patch"
          git -C "$RUNNER_TEMP/PyFVS" apply "$RUNNER_TEMP/pyfvs.patch"
          git -C "$RUNNER_TEMP/PyFVS/fvs" apply --check "$RUNNER_TEMP/fvsbc.patch"
          git -C "$RUNNER_TEMP/PyFVS/fvs" apply "$RUNNER_TEMP/fvsbc.patch"

      - name: Build the BC variant
        working-directory: ${{ runner.temp }}/PyFVS
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.3.11"
        run: |
          python -m pip install --no-build-isolation . \
            --config-settings=setup-args="-Dfvsvariants=bc"

      - name: Import the built variant
        run: |
          python -c "import pyfvs.fvsbc as m; print('imported', m.__name__)"
          python -c "import pyfvs; print(pyfvs.list_variants())"

      # The end-to-end test skips in the quality job, because that job has no extension. This is the
      # one place it can run, so it runs here rather than being a skip nobody ever converts.
      #
      # tests/test_oracle.py is deliberately NOT run here. It was wired in and failed: the runner's
      # build differs numerically from the one that produced FVS's oracle, on 104 of 164 rows, so the
      # comparison is exact only on the toolchain that produced it. Making it a gate needs a decision
      # about tolerance or a pinned toolchain, and that is recorded rather than assumed.
      - name: Run the end-to-end run test
        run: |
          python -m pip install --quiet pytest pandas
          python -m pytest tests/test_run.py -q -o addopts="" -p no:cacheprovider

      # Temporary diagnostic, and it does not gate: it answers whether the run is deterministic on
      # this machine, which decides whether an exact oracle comparison can ever hold here. Remove
      # once the answer is recorded.
      - name: Diagnose the oracle difference
        continue-on-error: true
        env:
          FVSBC_CASE_DIR: ${{ runner.temp }}/PyFVS/fvs/tests/FVSbc
        run: |
          python -m pip install --quiet pytest pandas
          PYTHONPATH=tests:src python - <<'PY'
          import tempfile
          from pathlib import Path
          from test_oracle import CASE, case_directory, differing_lines, run_case

          case = case_directory()
          produced = []
          for index in (1, 2):
              work = Path(tempfile.mkdtemp()) / f"run{index}"
              work.mkdir()
              run_case(case, work)
              produced.append((work / f"{CASE}.sum").read_text(encoding="latin-1"))
          expected = (case / f"{CASE}.sum.save").read_text(encoding="latin-1")
          print("DIAG run1 vs run2:", len(differing_lines(produced[0], produced[1])))
          print("DIAG run1 vs oracle:", len(differing_lines(produced[0], expected)))
          print("DIAG run2 vs oracle:", len(differing_lines(produced[1], expected)))
          PY

  dashboard:
    name: Green dashboard summary
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the dashboard
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          python scripts/dashboard.py --markdown --json runtime/dashboard.json > runtime/dashboard.md
          status=$?
          cat runtime/dashboard.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the dashboard record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-record
          path: runtime/dashboard.json

  pre-commit:
    name: Pre-commit parity
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
